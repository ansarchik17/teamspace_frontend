# Keep the board's existing internal URL and public routing. Only its own realm
# is reachable through this bridge; Workspace/master/admin are never forwarded.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    # OIDC requests contain authorization codes and state in the query string.
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # A later Workspace deploy can replace Keycloak and change its container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    server {
        listen 8080;
        server_name _;
        set $shared_keycloak workspace-keycloak:8080;
        client_max_body_size 2m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        location /realms/whiteboard/ {
            proxy_pass http://$shared_keycloak/auth$request_uri;
        }
        location /resources/ {
            proxy_pass http://$shared_keycloak/auth$request_uri;
        }
        location / { return 404; }
    }
}
