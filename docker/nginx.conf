map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Внутренний nginx.conf проекта
server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # iForm serves assets on the company origin; business APIs stay in Workspace.
    location = /iform-app { return 302 /iform-app/; }
    location ^~ /iform-app/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $iform_frontend_upstream http://iform-frontend:80;
        proxy_pass $iform_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    # SenimDesk is published on the same origin at /sd, including company
    # hosts. Resolve optional containers at request time during deployments.
    location = /sd {
        return 301 /sd/;
    }

    location ^~ /sd/api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $sd_api_upstream http://sd-backend:18080;
        rewrite ^/sd/api/(.*)$ /$1 break;
        proxy_pass $sd_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # The deployed SD bundle uses /sd/keycloak as its public SSO endpoint.
    location ^~ /sd/keycloak/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $sd_keycloak_upstream http://workspace-keycloak:8080;
        rewrite ^/sd/keycloak/(.*)$ /auth/$1 break;
        proxy_pass $sd_keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_read_timeout 300s;
    }

    # The callback is a client route. Older SD images proxy /auth/* to
    # Keycloak, so serve the SPA entrypoint explicitly without changing its URL.
    location = /sd/auth/callback {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $sd_callback_upstream http://sd-frontend:80;
        rewrite ^ /index.html break;
        proxy_pass $sd_callback_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /sd/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $sd_frontend_upstream http://sd-frontend:80;
        rewrite ^/sd/(.*)$ /$1 break;
        proxy_pass $sd_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http://$host/ https://$host/;
        proxy_read_timeout 300s;
    }

    # Whiteboard is deployed as a separate container on the shared Docker
    # network. Resolve it at request time so this frontend can start before
    # the optional whiteboard service is recreated.
    location = /whiteboard {
        return 301 /whiteboard/;
    }

    location ^~ /whiteboard/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $whiteboard_upstream http://whiteboard-frontend:80;
        rewrite ^/whiteboard/(.*)$ /$1 break;
        proxy_pass $whiteboard_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /whiteboard;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Always revalidate the SPA entrypoint so a deployment cannot leave the
    # browser on an old JS bundle. Fingerprinted assets remain cacheable below.
    location = /web/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # EPS static (HTML references absolute /assets/* — rewrite to /web/eps-remote/assets/*)
    location /web/eps-remote/assets/ {
        rewrite ^/web/eps-remote/assets/(.*)$ /assets/$1 break;
        proxy_pass http://92.38.49.156:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'd=`/api`' 'd=`/web/eps-remote/api`';
        sub_filter 'src:`/eps.svg`' 'src:`/web/eps-remote/eps.svg`';
    }

    location = /web/eps-remote/eps.svg {
        proxy_pass http://92.38.49.156:5173/eps.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # EPS app + API under /web/eps-remote → http://92.38.49.156:5173
    location /web/eps-remote/ {
        rewrite ^/web/eps-remote/(.*)$ /$1 break;
        proxy_pass http://92.38.49.156:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'src="/assets/' 'src="/web/eps-remote/assets/';
        sub_filter 'href="/assets/' 'href="/web/eps-remote/assets/';
        sub_filter 'href="/eps.svg"' 'href="/web/eps-remote/eps.svg"';
        sub_filter '<script type="module"' '<script>(function(){function g(v){return v==="/eps.svg"?"/web/eps-remote/eps.svg":v}var f=window.fetch.bind(window);window.fetch=function(i,n){var u=typeof i==="string"?i:i instanceof URL?i.href:i.url;try{var p=u.startsWith("http")?new URL(u).pathname:u;if(p.indexOf("/api/")===0||p==="/api"){var r="/web/eps-remote"+p+(u.startsWith("http")?new URL(u).search:"");if(typeof i==="string")return f(r,n);if(i instanceof Request)return f(new Request(r,i),n);return f(r,n)}}catch(e){}return f(i,n)};var s=Element.prototype.setAttribute;Element.prototype.setAttribute=function(n,v){if(n==="src")v=g(v);return s.call(this,n,v)};var d=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,"src");d&&d.set&&Object.defineProperty(HTMLImageElement.prototype,"src",{get:d.get,set:function(v){d.set.call(this,g(v))},configurable:!0,enumerable:d.enumerable})})();</script><script type="module"';
    }

    # EPS mail API (bundle calls /api/auth, /api/emails, … — before workspace /api)
    location ~ ^/api/(auth|emails|mailboxes|calendar|contacts|ai)(/|$) {
        proxy_pass http://92.38.49.156:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # An old/unaccounted AI image must never become callable just because the
    # frontend was deployed first. Only the accounted Python service returns 204.
    location = /_workspace_ai_accounting_ready {
        internal;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $alem_ai_ready_upstream http://alemcloud-api:8000;
        proxy_pass $alem_ai_ready_upstream/internal/accounting/ready;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # AlemAI endpoints (strip /api prefix, then proxy through the shared
    # Workspace Docker network (workspace_workspace) to the AI container)
    location ~ ^/api/(ask|tools)(/.*)?$ {
        auth_request /_workspace_ai_accounting_ready;
        client_max_body_size 32m;
        # Resolve the AI container through Docker DNS at request time. This
        # keeps nginx bootable even when the AI compose project starts later.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $alem_ai_upstream http://alemcloud-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $alem_ai_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Smart Agent uses SSE for token streaming. Do not let nginx collect
        # the response until its proxy buffer is full.
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;

        # Rewrite redirect headers from the backend to preserve the /api prefix and HTTPS scheme
        proxy_redirect http://$host/tools/ $scheme://$host/api/tools/;
        proxy_redirect http://$host/tools $scheme://$host/api/tools;
        proxy_redirect https://$host/tools/ $scheme://$host/api/tools/;
        proxy_redirect https://$host/tools $scheme://$host/api/tools;
        proxy_redirect /tools/ /api/tools/;
        proxy_redirect /tools /api/tools;

        proxy_redirect http://$host/ask/ $scheme://$host/api/ask/;
        proxy_redirect http://$host/ask $scheme://$host/api/ask;
        proxy_redirect https://$host/ask/ $scheme://$host/api/ask/;
        proxy_redirect https://$host/ask $scheme://$host/api/ask;
        proxy_redirect /ask/ /api/ask/;
        proxy_redirect /ask /api/ask;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Deep Research drafts and verifies answers within a 210-second backend
    # budget. The ordinary API proxy keeps nginx's short default timeout.
    location ~ ^/api/(?:v1/)?notebook/chats/[0-9a-fA-F-]+/(?:ask|context)$ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $research_api_upstream http://workspace-api:8080;
        rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
        proxy_pass $research_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Main API proxy with automatic v1 fallback for legacy modules (like Drive)
    location /api/ {
        # Keep nginx bootable while the backend container is being recreated.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $workspace_api_upstream http://workspace-api:8080;
        # If request doesn't start with /api/v1/ or /api/ask or /api/tools, try to prepend /v1/
        # This fixes Drive module calling /api/auth/me instead of /api/v1/auth/me
        rewrite ^/api/(?!v1/|ask|tools)(.*)$ /api/v1/$1 last;

        proxy_pass $workspace_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # In production this container is bound to 127.0.0.1 behind the
        # HTTPS virtual host. Never trust a client-supplied forwarded proto.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # LiveKit public websocket endpoint under /livekit -> internal LiveKit :7880.
    # Strip the /livekit prefix so upstream receives its native routes (/rtc, /validate, ...).
    location = /livekit {
        proxy_pass http://100.72.193.179:7880;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://100.72.193.179:7880;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /web/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    # Редирект для удобства
    location = / {
        return 301 /web/;
    }
}
